name: Release

# 推送 v<version> 标签时，构建 Windows 版本、签名更新包，并上传到该版本的
# draft Release；检查过附件后手动发布，安装后的应用再更新过去。
on:
  push:
    tags:
      - "v*"

# 创建 tag / draft release 与上传附件需要写权限
permissions:
  contents: write

# 同一个 tag 只跑一次；不取消已开始的发布会话
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # go.mod 的 replace 指向 ../mygo，这里固定 MyGo 的提交，构建才可复现。
  MYGO_REPO: github.com/egoist/mygo
  MYGO_COMMIT: 977ea57e0baf78da62698ba7371420d192260466

jobs:
  release:
    name: Build MyGo Launcher and upload the update
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go.mod 用 replace 指向 ../mygo（$GITHUB_WORKSPACE 的上一级），本地开发时
      # 是同一台机器上的 checkout；CI 里在这里补一个固定提交的克隆。
      - name: Checkout MyGo beside the repo
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'mygo'
          git clone --quiet "https://$env:MYGO_REPO.git" $dest
          git -C $dest checkout --quiet $env:MYGO_COMMIT
          "checked out MyGo at $env:MYGO_COMMIT -> $dest"

      # MyGo 的构建会把 exe 放进安装包、归档和更新包；补丁让它在这些步骤之前，
      # 按 MYGO_UPX 指定的打包器压缩 exe（--best --lzma）。
      - name: Patch MyGo to run UPX
        shell: pwsh
        run: |
          $mygo = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'mygo'
          git -C $mygo apply "$env:GITHUB_WORKSPACE/.github/patches/mygo-upx.patch"

      # 固定版本，避免发布时突然换了打包器；file-lite 的 release 也这样钉住。
      - name: Install UPX
        shell: pwsh
        run: |
          $version = '5.3.0'
          $zip = Join-Path $env:RUNNER_TEMP 'upx.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'upx'
          curl.exe -fsSL -o $zip "https://github.com/upx/upx/releases/download/v$version/upx-$version-win64.zip"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter upx.exe | Select-Object -First 1
          Split-Path $exe.FullName -Parent | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe.FullName --version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 的 go 指令，不用手动同步
          go-version-file: go.mod
          cache: true

      # tag 必须与 mygo.json 的版本一致；mygo build 的更新包按这个版本命名，
      # 并上传到这个 tag 的 release。
      - name: Check the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content 'mygo.json' -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'mygo.json has no version field' }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match mygo.json version $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release tag: $env:GITHUB_REF_NAME"

      # 更新窗口和 Release notes 都用 CHANGELOG 里该版本的小节；没有这一节
      # mygo build 会失败。
      - name: Take the notes from the changelog
        shell: pwsh
        run: |
          $version = (Get-Content 'mygo.json' -Raw | ConvertFrom-Json).version
          $inside = $false
          $notes = foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s') {
              $inside = $line.Trim() -eq "## $version"
              continue
            }
            if ($inside) { $line }
          }
          $text = ($notes -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($text)) { throw "CHANGELOG.md has no section for $version" }
          $text | Out-File -FilePath "$env:RUNNER_TEMP/notes.md" -Encoding utf8
          $text

      # mygo build -upload 把附件放进已存在的 draft release。
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY `
              --draft --verify-tag --title $env:GITHUB_REF_NAME `
              --notes-file "$env:RUNNER_TEMP/notes.md"
          }

      # 私钥来自 GitHub secret：丢失后已安装的旧版本无法再接受新更新，
      # 泄露则可以被用来推送任意代码。
      - name: Test
        run: go test ./...

      - name: Build and upload the signed update
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_UPX: upx
        run: go tool mygo build -platform windows/amd64 -upload

      # 补丁在 MYGO_UPX 下会先压缩再打包；这里确认 exe 确实被 UPX 压缩过。
      - name: Check the packed executable
        shell: pwsh
        run: |
          $exe = 'build/windows-amd64/MyGo Launcher.exe'
          & upx -t $exe
          if ($LASTEXITCODE -ne 0) { throw 'the app was not packed with UPX' }
          'app size: {0:N0} bytes' -f (Get-Item $exe).Length

      - name: List the built files
        shell: pwsh
        run: Get-ChildItem build/windows-amd64 | Select-Object Name, Length

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygo-launcher-${{ steps.version.outputs.version }}
          path: build/windows-amd64/
          if-no-files-found: error
          retention-days: 14

# 发布：在 GitHub 上检查 draft 的附件，确认后发布，并勾选
# "Set as the latest release"，安装后的应用才会读到新的 update 清单。
#
# 备注：
# - 版本号取自 mygo.json 的 version（发版前手动往上抬，同时改 src/version.go 的
#   appVersion），tag 必须形如 v0.3.0。
# - 私钥在仓库 secret MYGO_UPDATER_PRIVATE_KEY；mygo.json 的
#   updates.publicKey 是它的公钥，不要更换。
