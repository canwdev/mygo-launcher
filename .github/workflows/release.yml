name: Release

# 每次 push 到 master 自动构建并发 Release（附件 exe 与安装包）。
# 只构建 windows/amd64：原生 UI 打包只面向 Windows。
on:
  push:
    branches:
      - master
  # 也可以在 Actions 页面手动 Run workflow 重新发一版
  workflow_dispatch:

# 创建 tag / release 需要写权限，默认的 GITHUB_TOKEN 足够
permissions:
  contents: write

# 串行执行，避免两次 push 抢同一个 release；不取消已开始的发布会话
concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # go.mod 的 replace 指向 ../mygo，这里固定 MyGo 的提交，构建才可复现。
  MYGO_REPO: github.com/egoist/mygo
  MYGO_COMMIT: 977ea57e0baf78da62698ba7371420d192260466

jobs:
  release:
    name: Build Go Launcher and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go.mod 用 replace 指向 ../mygo（$GITHUB_WORKSPACE 的上一级），本地开发时
      # 是同一台机器上的 checkout；CI 里在这里补一个固定提交的克隆。
      - name: Checkout MyGo beside the repo
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'mygo'
          git clone --quiet "https://$env:MYGO_REPO.git" $dest
          git -C $dest checkout --quiet $env:MYGO_COMMIT
          "checked out MyGo at $env:MYGO_COMMIT -> $dest"

      - name: Read version from mygo.json
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content 'mygo.json' -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'mygo.json has no version field' }
          # tag = v<mygo.json version>-<GitHub run number>，例如 v0.1.2-42
          $tag = 'v{0}-{1}' -f $version, '${{ github.run_number }}'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release tag: $tag"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 的 go 指令，不用手动同步
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        # go tool mygo 来自 go.mod 的 tool 指令：打包会生成 exe 与 NSIS 安装包
        run: go tool mygo build

      - name: Check the built files
        id: artifact
        shell: pwsh
        run: |
          $dir = 'build/windows-amd64'
          $exe = Join-Path $dir 'Go Launcher.exe'
          if (-not (Test-Path $exe)) { throw "build produced no $exe" }
          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "size   = $($item.Length) bytes"
          "sha256 = $hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem $dir | Select-Object Name, Length

      # 即使 Release 步骤失败，产物也留在 Actions 里可下载
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-launcher-${{ steps.version.outputs.tag }}
          path: build/windows-amd64/
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: go-launcher ${{ steps.version.outputs.tag }}
          # 让 tag 指向本次 push 的 commit
          target_commitish: ${{ github.sha }}
          make_latest: true
          draft: false
          prerelease: false
          # 附件：单文件 exe 与安装包
          files: |
            build/windows-amd64/Go Launcher.exe
            build/windows-amd64/go-launcher-setup-*.exe
          fail_on_unmatched_files: true
          # 自动附带由 commit 生成的 changelog
          generate_release_notes: true
          body: |
            Automated build of `master` — `${{ github.sha }}` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))

            - **Assets:** `Go Launcher.exe` (single file, no runtime needed — the UI is drawn by Go) and the NSIS installer
            - **Version:** `${{ steps.version.outputs.version }}` (from `mygo.json`) + build ${{ github.run_number }}
            - **SHA256:** `${{ steps.artifact.outputs.sha256 }}`
            - **Built with:** MyGo `${{ env.MYGO_COMMIT }}`

# 备注：
# - 版本号取自 mygo.json 的 version（发版前手动往上抬，同时改 version.go 的
#   appVersion），tag 形如 v0.1.2-42，其中 42 是 GitHub 的 run number。
# - 每次 push 都会新建一个 release（每个 tag 一次）；只想在打 tag 时发布的话，
#   把 on.push 换成 on.push.tags: ['v*']。
